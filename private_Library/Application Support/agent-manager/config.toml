# Agent Manager Configuration
# This configuration adds Mistral Vibe support to agent-manager
# Configuration file location:
# - macOS: ~/Library/Application Support/agent-manager/config.toml
# - Linux: ~/.config/agent-manager/config.toml
# - Windows: %APPDATA%\agent-manager\config.toml

# Global polling interval (default: 2s)
poll_interval = "2s"

# Mistral Vibe configuration
[tools.vibe]
command = "vibe"
default_status = "idle"

# Regex to identify the input box/cutoff point
activity_cutoff = "(?m)^\\s*> "

# Status detection rules - these match against the visible pane text
# Rules are evaluated top-down, first match wins
rules = [
  # Waiting state - when Vibe is waiting for user input or approval
  { state = "waiting", pattern = "(?im)approve\\?\\s*(y/n)" },
  { state = "waiting", pattern = "(?im)permission\\s+required" },
  { state = "waiting", pattern = "(?im)press\\s+enter\\s+to\\s+continue" },
  { state = "waiting", pattern = "(?im)waiting\\s+for\\s+approval" },
  { state = "waiting", pattern = "(?im)requires\\s+your\\s+approval" },
  { state = "waiting", pattern = "(?im)\\?\\s*(y/n/.*\\?)" },
  
  # Working state - when Vibe is actively processing
  { state = "working", pattern = "(?im)thinking\\." },
  { state = "working", pattern = "(?im)generating\\." },
  { state = "working", pattern = "(?im)thinking" },
  { state = "working", pattern = "(?im)generating" },
  { state = "working", pattern = "(?im)executing" },
  { state = "working", pattern = "(?im)running" },
  { state = "working", pattern = "(?im)loading" },
  { state = "working", pattern = "(?im)processing" },
  { state = "working", pattern = "(?im)analyzing" },
  { state = "working", pattern = "(?im)searching" },
  
  # Error state
  { state = "errored", pattern = "(?im)\\[x\\]" },
  { state = "errored", pattern = "(?im)\\[X\\]" },
  { state = "errored", pattern = "(?im)^\\s*error:" },
  { state = "errored", pattern = "(?im)^\\s*Error" },
  { state = "errored", pattern = "(?im)failed" },
  { state = "errored", pattern = "(?im)exception" },
  { state = "errored", pattern = "(?im)traceback" },
  { state = "errored", pattern = "(?im)not\\s+found" },
]

# Session management
# Vibe supports --resume with session ID
resume_by_id_command = "vibe --resume {id}"

# Vibe takes prompt positionally (no flag needed)
prompt_flag = ""

# No session ID flag - Vibe manages sessions internally
session_id_flag = ""

# UI Settings
[ui]
theme_auto = true